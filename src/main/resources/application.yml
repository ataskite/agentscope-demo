# AgentScope Demo Application Configuration

server:
  port: 8081

spring:
  application:
    name: agentscope-demo
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # Exclude DataSource auto-config by default (no DB needed for default startup).
  # The mysql/postgresql profiles provide their own DataSource bean via
  # DistributedStateStoreConfig (S13), so auto-config is not used there either.
  # A2A server auto-config is excluded too by default: it requires an AgentRunner bean
  # that is only provided under the "a2a" profile (see A2aServerConfig). Excluding here
  # keeps the default startup clean; the a2a profile re-enables it on demand.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - io.agentscope.spring.boot.a2a.AgentscopeA2aAutoConfiguration

# AgentScope Configuration
agentscope:
  # P0-1 security fix: shared-token authentication for /chat/**, /api/**,
  # /channel/**, /a2a/**, /ag-ui/**. Enabled by default; when api-token is blank
  # a random token is generated and logged at startup. Set AGENTSCOPE_SECURITY_API_TOKEN
  # for a stable token, or AGENTSCOPE_SECURITY_ENABLED=false for local-only dev.
  security:
    enabled: ${AGENTSCOPE_SECURITY_ENABLED:true}
    api-token: ${AGENTSCOPE_SECURITY_API_TOKEN:}
    header-name: X-API-Token

  # Model Configuration
  model:
    # Default model provider
    provider: dashscope
    # DashScope configuration
    dashscope:
      # API key (can be overridden by DASHSCOPE_API_KEY environment variable)
      api-key: ${DASHSCOPE_API_KEY:}
      # Model name
      model-name: qwen-plus
      # Enable streaming
      stream: true
      # Enable thinking mode
      enable-thinking: true
      # Thinking budget (tokens)
      thinking-budget: 1024

  # Memory Configuration
  memory:
    # Memory type: in-memory, mysql, redis
    type: in-memory
    # Max conversation history
    max-history: 100

  # Tool Configuration
  tools:
    # Enable built-in tools
    enabled: true

# P1-3 security fix: Tavily API key must be injected via environment variable.
# Never commit a real key; web_search degrades to "unavailable" when absent.
tavily:
  api-key: ${TAVILY_API_KEY:}

  # Session Configuration
  session:
    enabled: true
    storage-path: ${user.home}/.agentscope/demo-sessions

  # Knowledge Configuration
  knowledge:
    enabled: true
    # P3-3: runtime directory instead of a source-tree relative path — with a packaged
    # jar the old value resolved against the process CWD and wrote into (nonexistent)
    # source directories. Override with AGENTSCOPE_KNOWLEDGE_PATH if needed.
    path: ${AGENTSCOPE_KNOWLEDGE_PATH:${user.home}/.agentscope/knowledge}
    embedding-model: text-embedding-v3
    dimensions: 1024
    chunk-size: 512
    overlap-size: 50
    split-strategy: PARAGRAPH
    auto-index-on-startup: true

  # MCP (Model Context Protocol) Configuration
  mcp:
    enabled: true
    demo:
      enabled: true
      sse-port: 9090
      http-port: 9091
      startup-timeout: 30

# Logging Configuration
logging:
  level:
    root: INFO
    io.agentscope: INFO
    com.msxf.agentscope: INFO
    METRICS: INFO
  pattern:
    # P3-2: include correlation id fields; springApplicationName/traceId populate when
    # tracing (OTel/MDC) is active, empty otherwise
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [${spring.application.name:-},%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
