agents:
  # === Harness Demo: Complaint Reviewer (Claw Mode) ===
  - agentId: complaint-reviewer
    category: harness
    type: HARNESS
    name: 投诉复盘分析师
    description: 基于事实链的投诉根因复盘与处置ROI测算平台。上传每日投诉数据，自动完成根因分析→趋势对比→策略优化→ROI测算。
    modelName: deepseek-v4-flash
    streaming: true
    enableThinking: false
    harnessConfig:
      workspace: "${user.home}/.agentscope/complaint-reviewer"
      filesystemMode: LOCAL
      executionMode: CLAW
      maxContextTokens: 8000
      metaToolEnabled: true
      permissionConfig:
        # Demo HITL resume path (agentscope_confirm_results metadata) is not wired
        # end-to-end for Harness agents; accept_edits makes unmatched tools (e.g. the
        # harness shell tool whose real name is "execute", not "execute_shell_command")
        # fall through to the engine's default ASK, which then poisons the cached
        # HarnessAgent instance with a ToolUseBlock stuck in ASKING state on the next
        # message. Use bypass here until Harness HITL is implemented (see ROADMAP).
        defaultMode: bypass
        denyTools:
          - execute
        askTools:
          - write_text_file
          - edit_docx
      compaction:
        triggerMessages: 30
        keepMessages: 10
        flushBeforeCompact: true
      subagents:
        - name: root-cause-analyst
          description: 根因分析师，基于投诉数据做事实链分析和根因分类
        - name: trend-analyst
          description: 趋势分析师，跨日对比投诉数据变化趋势和预警信号
        - name: strategy-optimizer
          description: 策略优化顾问，基于根因和趋势推荐优化策略
        - name: roi-calculator
          description: ROI 测算师，对不同策略做成本影响测算和模拟
    samplePrompts:
      - prompt: "分析今日投诉数据，做根因分析和ROI测算"
        expectedBehavior: "触发完整分析链：根因分析→趋势对比→策略优化→ROI测算"
      - prompt: "今天的费用类投诉有什么变化趋势？"
        expectedBehavior: "基于历史记忆做跨日趋势对比"

  # === Harness Demo: Finance Intelligence Tracker (Builder Mode) ===
  - agentId: finance-intel-tracker
    category: harness
    type: HARNESS
    name: 金融情报追踪助手
    description: |
      自动采集金融行业动态，发现趋势信号，生成分析简报。
      支持银行、证券、保险、基金、信托等子领域情报追踪。
      具备自我进化能力，可自动学习新技能和孵化新子 Agent。
      [Builder 多用户隔离模式]
    modelName: deepseek-v4-flash
    streaming: true
    enableThinking: false
    harnessConfig:
      workspace: "${user.home}/.agentscope/finance-intel-tracker"
      filesystemMode: LOCAL
      executionMode: BUILDER
      isolationScope: USER
      compaction:
        triggerMessages: 30
        keepMessages: 10
        flushBeforeCompact: true
      subagents:
        - name: intel-collector
          description: 情报采集员，使用 Web 搜索和 Shell 拉取数据，具备搜索策略自我进化能力
        - name: finance-trend-analyst
          description: 趋势分析师，对比历史数据发现趋势信号，维护双层记忆，可自定义检测逻辑
        - name: intel-report-writer
          description: 报告撰写员，生成结构化情报简报，可根据反馈调整报告格式
    samplePrompts:
      - prompt: "分析近期银行理财监管政策变化"
        expectedBehavior: "触发情报采集→趋势分析→报告生成全流程"
      - prompt: "关注保险资金运用新规动态"
        expectedBehavior: "自动搜索保险行业政策并生成简报"
      - prompt: "证券行业风控指引有什么更新"
        expectedBehavior: "追踪证券行业最新风控政策变化"
      - prompt: "基金销售新规对行业的影响"
        expectedBehavior: "分析基金销售新规并评估行业影响"
